name: Generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate profile assets
        run: node .github/scripts/generate-readme-assets.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PROFILE_USERNAME: D162005
          LEETCODE_USERNAME: D_16

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: D162005
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%2300d4ff&color_dots=%23ebedf0,%23c6e48b,%237bc96f,%23239a3b,%23196f2f
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%237df9ff&color_dots=%230b1220,%23123041,%230f5f73,%230aa2bf,%235ef2ff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
