    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="100%" height="100%" rx="24" fill="url(#bg)" />
  <rect x="24" y="24" width="912" height="232" rx="20" fill="#111827" stroke="rgba(148,163,184,0.16)" filter="url(#shadow)" />
  <rect x="48" y="42" width="120" height="4" rx="2" fill="url(#accent)" />
  <text x="48" y="78" fill="#e5eef7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="28" font-weight="700">GitHub Stats</text>
  <text x="48" y="108" fill="#8aa0b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14">D162005/D162005 profile snapshot</text>
  
      
    <text x="58" y="152" fill="#8aa0b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" letter-spacing="0.04em">PUBLIC REPOS</text>
